# Copy to config.yaml. For Docker, mount it as /data/config.yaml and set
# claude_oauth.token_dir: "/data" so all state persists in the data volume.
server:
  port: 9090
  # Dashboard login. Required: if either half is empty the dashboard refuses every
  # login attempt (blank credentials would otherwise be matched by a blank form).
  # LLM_PROXY_ADMIN_USER / LLM_PROXY_ADMIN_PASSWORD work as a fallback when you
  # would rather keep secrets out of this file.
  admin_user: "admin"
  admin_password: "changeme"
  # Read-only credential for the desktop tray widget's /api/tray polls. Generate
  # one from the dashboard (Config -> Admin -> Tray token). Not an API key: it
  # cannot spend quota, and the keys from the Keys page are rejected there.
  # Leave unset to keep the widget locked out.
  # tray_token: "tray-..."
  # cert_file: "/path/to/cert.pem"   # enable HTTPS
  # key_file: "/path/to/key.pem"

vertex:
  project_id: "your-gcp-project-id"
  region: "us-east5"
  models:
    # `model:` is only needed when the name clients call differs from the id the
    # upstream knows. Omit it and the name is sent through as-is.
    - name: "claude-sonnet-4-6"
    - name: "claude-opus-4-6"
    - name: "claude-haiku-4-5"
      model: "claude-haiku-4-5-20251001"   # upstream wants the dated snapshot

claude_oauth:
  enabled: true
  # token_dir: "/data"  # for Docker; defaults to ~/.llm-proxy
  models:
    - "claude-sonnet-4-6-oauth"
    - "claude-opus-4-6-oauth"
    - "claude-opus-4-8-oauth"

codex:
  enabled: true
  models:
    - "gpt-5.5"
    - "gpt-5.4"
    - "gpt-5.4-mini"
    - "gpt-5.3-codex"

# Kimi Code key is read from the environment variable below. Never put the
# actual key in this file or commit it to Git. For a Kimi API Platform key,
# use https://api.moonshot.cn/v1 with api_format: "openai" and platform model IDs.
kimi:
  enabled: false
  base_url: "https://api.kimi.com/coding"
  api_key_env: "MOONSHOT_API_KEY"
  api_format: "anthropic"
  models:
    - name: "kimi-k3"
      model: "k3"                          # upstream only knows "k3"
    - name: "kimi-for-coding"
    - name: "kimi-for-coding-highspeed"

# AnyGen uses one app-scoped sk-ag key for Chat Completions and Models. The key
# must grant exactly those two actions with whole_app=false. The live model list
# is fetched for free at startup; models below are used only if that sync fails.
# Chat Completions is non-streaming only. /v1/responses waits for the completed
# result and adapts it to typed Responses SSE for clients such as Codex CLI.
# Credits come from the platform-native /v1/openapi/key/verify endpoint, outside
# this app base URL.
anygen:
  enabled: false
  base_url: "https://www.anygen.io/v1/openapi/anyclaw/app/appg4oo4fl2ay7g2u7my4eaqzy/api/v1"
  api_key_env: "ANYGEN_LLM_KEY"
  models:
    - "gpt-5.6-luna"

# Cost accounting. Every request is priced at write time from a built-in table
# of published list rates (Anthropic / OpenAI / Moonshot) and shown on the
# dashboard. Note this is what the tokens *would* cost on the pay-per-token API:
# Claude Code and Codex subscription traffic is not billed per request.
#
# This section is optional, and the dashboard writes it for you (Config →
# Models → click a model's price). Use it to correct a rate that has changed, or
# to price a model the built-in table has never heard of. Values are USD per 1M
# tokens; a model with no price anywhere is reported as unknown rather than $0,
# so write an all-zeros entry to declare one genuinely free.
# pricing:
#   models:
#     - name: "kimi-for-coding"   # subscription seat: no per-token cost
#       input: 0
#       output: 0
#     - name: "my-private-model"
#       input: 1.5
#       output: 6.0
#       cache_read: 0.15
#       cache_write: 1.875
