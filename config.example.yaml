# Copy to config.yaml. For Docker, mount it as /data/config.yaml and set
# claude_oauth.token_dir: "/data" so all state persists in the data volume.
server:
  port: 9090
  # Dashboard login. Required: if either half is empty the dashboard refuses every
  # login attempt (blank credentials would otherwise be matched by a blank form).
  # LLM_PROXY_ADMIN_USER / LLM_PROXY_ADMIN_PASSWORD work as a fallback when you
  # would rather keep secrets out of this file.
  admin_user: "admin"
  admin_password: "changeme"
  # Read-only credential for the desktop tray widget's /api/tray polls. Generate
  # one from the dashboard (Config -> Admin -> Tray token). Not an API key: it
  # cannot spend quota, and the keys from the Keys page are rejected there.
  # Leave unset to keep the widget locked out.
  # tray_token: "tray-..."
  # cert_file: "/path/to/cert.pem"   # enable HTTPS
  # key_file: "/path/to/key.pem"

# --- Providers -------------------------------------------------------------
# A provider section is connection detail only: where to send a request and how
# to authenticate. What each one serves is decided further down, in `models`.

vertex:
  enabled: false
  project_id: "your-gcp-project-id"
  region: "us-east5"

claude_oauth:
  enabled: true
  # token_dir: "/data"  # for Docker; defaults to ~/.llm-proxy

codex:
  enabled: true

# Kimi Code key is read from the environment variable below. Never put the
# actual key in this file or commit it to Git. For a Kimi API Platform key,
# use https://api.moonshot.cn/v1 with api_format: "openai" and platform model IDs.
kimi:
  enabled: false
  base_url: "https://api.kimi.com/coding"
  api_key_env: "MOONSHOT_API_KEY"
  api_format: "anthropic"

# Generic Anthropic-compatible relay. The token is read from the environment;
# never paste it into this file or the dashboard.
relay:
  enabled: false
  base_url: "http://34.80.212.77/api"
  auth_token_env: "ANTHROPIC_AUTH_TOKEN"

# AnyGen uses one app-scoped sk-ag key for Chat Completions and Models. The key
# must grant exactly those two actions with whole_app=false. Chat Completions is
# non-streaming only. /v1/responses waits for the completed result and adapts it
# to typed Responses SSE for clients such as Codex CLI. Credits come from the
# platform-native /v1/openapi/key/verify endpoint, outside this app base URL.
anygen:
  enabled: false
  base_url: "https://www.anygen.io/v1/openapi/anyclaw/app/appg4oo4fl2ay7g2u7my4eaqzy/api/v1"
  api_key_env: "ANYGEN_LLM_KEY"

# --- Series defaults -------------------------------------------------------
# The provider order a model gets when it names none of its own. A model's
# series comes from its name prefix (claude-*, gpt-*, gemini-*, kimi-*,
# deepseek-*), so there is nothing to declare per model.
series:
  claude: [claude_oauth, vertex, relay]
  gpt: [codex, anygen]
  gemini: [anygen]
  kimi: [kimi]
  deepseek: [anygen]

# --- Published models ------------------------------------------------------
# This is the catalogue clients see. Each entry is a name they can ask for and
# the providers that can answer it, in the order they are tried: the first one
# that is enabled, configured and not rate-limited serves the request, and the
# rest are its failover chain. Clients never see provider names — no `-oauth` or
# `-vertex` suffixes, one name per model regardless of who ends up serving it.
#
# Omit `providers` to inherit the series default above, which is the common case.
models:
  - name: "claude-opus-5"
  - name: "claude-sonnet-4-6"
  - name: "claude-haiku-4-5"
    providers:
      # `{provider: id}` is the one rename left: some upstreams only know a model
      # by a dated snapshot id. It is a connection detail, invisible to clients.
      - vertex: "claude-haiku-4-5-20251001"
      - relay: "claude-haiku-4-5-20251001"
  - name: "gpt-5.5"
  - name: "kimi-k3"
    providers:
      - kimi: "k3"

# Cost accounting needs no configuration. Every request is priced at write time
# from a built-in table of published list rates (Anthropic / OpenAI / Moonshot).
# That figure is what the tokens *would* cost on the pay-per-token API: Claude
# Code and Codex subscription traffic is not billed per request. A model the
# table has never heard of is reported as unknown rather than $0.
