[package]
name = "llm-proxy-tray"
version = "0.1.0"
description = "LLM Proxy 桌面小工具"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "llm_proxy_tray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
