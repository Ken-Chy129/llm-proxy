<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LLM Proxy</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <header class="bar" data-tauri-drag-region>
    <div class="bar-title">
      <span class="dot" id="live-dot"></span>
      <span>LLM Proxy</span>
    </div>
    <div class="bar-actions">
      <span class="stamp" id="stamp">--:--</span>
      <button class="icon-btn" id="btn-refresh" title="立即刷新">⟳</button>
      <button class="icon-btn" id="btn-float" title="桌面悬浮挂件">▣</button>
      <button class="icon-btn" id="btn-pin" title="取消置顶">▲</button>
      <button class="icon-btn" id="btn-settings" title="设置">⚙</button>
    </div>
  </header>

  <div id="error" class="error hidden"></div>
  <div id="alert" class="alert hidden"></div>

  <!-- 悬浮挂件（仅 ?mode=float）：折叠是一个球，鼠标移上去原地展开成紧凑卡。
       跟上面的面板刻意不同源——常驻桌面只回答"现在还能不能放心用"。 -->
  <div id="ball" data-tauri-drag-region title="额度">
    <span class="ball-pct" id="ball-pct">–</span>
    <span class="dot" id="ball-dot"></span>
  </div>

  <section id="fcard">
    <div class="fcard-head" data-tauri-drag-region>
      <span class="fcard-pct" id="fcard-pct">–</span>
      <span class="fcard-cap">可用</span>
      <span class="fcard-tokens" id="fcard-tokens"></span>
      <button class="icon-btn" id="btn-pin-float" title="取消置顶">▲</button>
    </div>
    <div id="fcard-rows"></div>
    <div id="fcard-err" class="fcard-err hidden"></div>
  </section>

  <main id="panel">
    <!-- 今日用量 -->
    <section class="card">
      <div class="card-head">
        <span class="card-label">今日用量</span>
        <span class="card-date" id="today-date"></span>
      </div>
      <div class="hero">
        <div class="hero-main">
          <div class="hero-num" id="today-tokens">–</div>
          <div class="hero-unit">tokens</div>
        </div>
        <div class="hero-side">
          <div class="hero-reqs"><b id="today-reqs">–</b> 请求</div>
          <div class="deltas">
            <span class="delta" id="delta-yday"></span>
            <span class="delta" id="delta-avg"></span>
          </div>
        </div>
      </div>
      <div class="spark" id="spark" title="今日每小时 token 消耗"></div>
      <div class="spark-axis" id="spark-axis"></div>
    </section>

    <!-- 账号额度 -->
    <section class="card">
      <div class="card-head">
        <span class="card-label">账号额度</span>
        <span class="card-date" id="quota-stamp"></span>
      </div>
      <div id="accounts"></div>
    </section>

    <!-- Key 分摊 -->
    <section class="card">
      <div class="card-head">
        <span class="card-label">今日 Key 分摊</span>
      </div>
      <div id="keys"></div>
    </section>

    <footer class="foot">
      <span id="foot-backends"></span>
      <span id="foot-idle"></span>
    </footer>
  </main>

  <!-- 设置面板 -->
  <section id="settings" class="settings hidden">
    <label>代理地址
      <input type="text" id="in-base" placeholder="https://proxy.example.com" spellcheck="false" />
    </label>
    <label>Tray Token
      <input type="password" id="in-token" placeholder="tray-..." spellcheck="false" />
    </label>
    <div class="row2">
      <label>刷新间隔（秒）
        <input type="number" id="in-interval" min="10" max="3600" />
      </label>
      <label>告警阈值（%）
        <input type="number" id="in-threshold" min="1" max="99" />
      </label>
    </div>
    <label class="chk">
      <input type="checkbox" id="in-notify" />
      <span>额度低于阈值时发系统通知</span>
    </label>
    <div class="settings-actions">
      <button class="btn ghost" id="btn-cancel">取消</button>
      <button class="btn" id="btn-save">保存</button>
    </div>
  </section>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
